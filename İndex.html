<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>RekorTok</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

button,input,textarea{
  font:inherit;
}

button{
  border:0;
  outline:0;
}

/* =========================================================
   INTRO
========================================================= */

#intro{
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
  transition:
    opacity 1s ease,
    visibility 1s ease;
}

#intro.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

#introName{
  font-size:clamp(42px,11vw,82px);
  font-weight:900;
  letter-spacing:2px;
  animation:pulse 1.8s ease-in-out infinite;
}

@keyframes pulse{
  0%,100%{
    opacity:.55;
    transform:scale(.96);
  }

  50%{
    opacity:1;
    transform:scale(1.04);
  }
}

/* =========================================================
   APP
========================================================= */

#app{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 30%,
      rgba(255,190,50,.13),
      transparent 38%
    ),
    linear-gradient(
      180deg,
      #120d02,
      #070604 55%,
      #020202
    );
}

/* =========================================================
   TOPBAR
========================================================= */

.topbar{
  position:absolute;
  left:0;
  right:0;
  top:0;

  z-index:100;

  min-height:76px;

  display:flex;
  align-items:center;
  gap:12px;

  padding:
    calc(12px + env(safe-area-inset-top))
    15px
    12px;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.94),
      rgba(0,0,0,.3),
      transparent
    );
}

.logo{
  font-size:24px;
  font-weight:950;
  letter-spacing:-1px;
  white-space:nowrap;
}

.search{
  position:relative;
  flex:1;
  max-width:430px;
  margin-left:auto;
}

#searchInput{
  width:100%;
  height:44px;

  padding:0 74px 0 18px;

  border-radius:999px;

  border:1px solid rgba(255,255,255,.16);

  outline:none;

  color:#fff;

  background:rgba(255,255,255,.08);

  backdrop-filter:blur(18px);

  font-size:15px;
}

#searchInput::placeholder{
  color:rgba(255,255,255,.5);
}

#searchInput:focus{
  border-color:rgba(255,210,80,.55);
  background:rgba(255,255,255,.12);
}

.searchIcon{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  pointer-events:none;
}

#clearSearch{
  position:absolute;
  right:42px;
  top:50%;
  transform:translateY(-50%);

  width:25px;
  height:25px;

  border-radius:50%;

  display:none;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,.14);
  color:#fff;

  cursor:pointer;
}

#clearSearch.show{
  display:flex;
}

/* =========================================================
   SEARCH INFO
========================================================= */

#searchInfo{
  position:absolute;

  top:86px;
  left:50%;

  transform:translateX(-50%);

  z-index:90;

  display:none;

  max-width:calc(100% - 30px);

  padding:8px 15px;

  border-radius:999px;

  background:rgba(0,0,0,.76);

  border:1px solid rgba(255,255,255,.12);

  backdrop-filter:blur(15px);

  font-size:12px;
  font-weight:900;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

#searchInfo.show{
  display:block;
}

/* =========================================================
   FEED
========================================================= */

#feed{
  position:relative;

  width:100%;
  height:100%;

  overflow:hidden;
}

.card{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:
    95px
    82px
    50px;

  opacity:0;

  transform:
    translateY(80px)
    scale(.97);

  pointer-events:none;

  transition:
    opacity .35s ease,
    transform .42s ease;
}

.card.active{
  opacity:1;

  transform:
    translateY(0)
    scale(1);

  pointer-events:auto;
}

.card.previous{
  transform:
    translateY(-80px)
    scale(.97);
}

.card.next{
  transform:
    translateY(80px)
    scale(.97);
}

/* =========================================================
   CARD CONTENT
========================================================= */

.content{
  width:min(720px,100%);

  display:flex;
  flex-direction:column;
  align-items:center;

  text-align:center;
}

.trophy{
  width:94px;
  height:94px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:30px;

  background:
    rgba(255,190,50,.09);

  border:
    1px solid rgba(255,210,80,.2);

  font-size:55px;

  margin-bottom:17px;

  box-shadow:
    0 20px 70px rgba(0,0,0,.4);
}

.recordType{
  padding:7px 14px;

  border-radius:999px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid rgba(255,255,255,.12);

  font-size:10px;

  font-weight:900;

  letter-spacing:1px;

  margin-bottom:14px;
}

.recordTitle{
  font-size:
    clamp(34px,7vw,64px);

  line-height:.98;

  font-weight:950;

  letter-spacing:-2.5px;

  margin-bottom:18px;
}

.recordQuestion{
  max-width:650px;

  font-size:
    clamp(19px,4.4vw,31px);

  line-height:1.15;

  font-weight:850;

  margin-bottom:12px;
}

.recordSub{
  max-width:590px;

  color:
    rgba(255,255,255,.6);

  font-size:14px;

  line-height:1.45;

  margin-bottom:20px;
}

/* =========================================================
   DETAIL BUTTON
========================================================= */

.detailBtn{
  padding:14px 23px;

  border-radius:999px;

  background:#fff;
  color:#000;

  font-size:13px;

  font-weight:950;

  cursor:pointer;

  transition:
    transform .18s ease,
    opacity .18s ease;
}

.detailBtn:active{
  transform:scale(.94);
}

/* =========================================================
   DETAILS
========================================================= */

.details{
  width:min(650px,100%);

  max-height:0;

  overflow:hidden;

  opacity:0;

  margin-top:0;

  padding:0 17px;

  border:
    1px solid transparent;

  border-radius:20px;

  background:
    rgba(0,0,0,.48);

  text-align:left;

  transform:translateY(-5px);

  transition:
    max-height .35s ease,
    opacity .25s ease,
    transform .25s ease,
    padding .35s ease,
    margin-top .35s ease;
}

.card.showDetails .details{
  max-height:min(320px,38vh);

  opacity:1;

  margin-top:13px;

  padding:15px 17px;

  transform:translateY(0);

  border-color:
    rgba(255,255,255,.12);

  overflow-y:auto;
}

.detail{
  padding:9px 0;

  border-bottom:
    1px solid rgba(255,255,255,.08);
}

.detail:last-child{
  border-bottom:0;
}

.detailLabel{
  color:
    rgba(255,255,255,.45);

  font-size:10px;

  font-weight:900;

  letter-spacing:.7px;

  margin-bottom:4px;
}

.detailText{
  color:
    rgba(255,255,255,.9);

  font-size:14px;

  line-height:1.4;
}

/* =========================================================
   ACTIONS
========================================================= */

.actions{
  position:absolute;

  right:15px;
  bottom:105px;

  z-index:30;

  display:flex;
  flex-direction:column;

  gap:12px;
}

.action{
  width:47px;
  height:47px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  border:
    1px solid rgba(255,255,255,.11);

  background:
    rgba(0,0,0,.46);

  backdrop-filter:blur(12px);

  color:#fff;

  font-size:20px;

  cursor:pointer;

  transition:
    transform .18s ease,
    background .18s ease;
}

.action:active{
  transform:scale(.87);
}

.action.liked{
  background:
    rgba(255,50,80,.22);
}

.action.saved{
  background:
    rgba(255,210,60,.22);
}

/* =========================================================
   EMPTY
========================================================= */

#empty{
  position:absolute;
  inset:0;

  z-index:30;

  display:none;

  align-items:center;
  justify-content:center;

  text-align:center;
}

#empty.show{
  display:flex;
}

.emptyIcon{
  font-size:56px;
  margin-bottom:14px;
}

.emptyTitle{
  font-size:25px;
  font-weight:900;
  margin-bottom:8px;
}

.emptyText{
  color:
    rgba(255,255,255,.55);
}

/* =========================================================
   PROGRESS
========================================================= */

.progress{
  position:absolute;

  left:15px;
  right:15px;
  bottom:18px;

  height:3px;

  border-radius:99px;

  overflow:hidden;

  background:
    rgba(255,255,255,.1);

  z-index:50;
}

.progressFill{
  height:100%;
  width:0;

  background:#fff;

  border-radius:99px;

  transition:
    width .35s ease;
}

/* =========================================================
   TOAST
========================================================= */

#toast{
  position:fixed;

  left:50%;
  bottom:60px;

  transform:
    translate(-50%,20px);

  z-index:999999;

  padding:11px 17px;

  border-radius:999px;

  background:
    rgba(15,15,15,.94);

  border:
    1px solid rgba(255,255,255,.12);

  color:#fff;

  font-size:13px;

  font-weight:800;

  opacity:0;
  pointer-events:none;

  transition:
    opacity .25s ease,
    transform .25s ease;
}

#toast.show{
  opacity:1;

  transform:
    translate(-50%,0);
}

/* =========================================================
   COMMENTS
========================================================= */

#modal{
  position:fixed;
  inset:0;

  z-index:5000;

  display:none;

  align-items:flex-end;

  background:
    rgba(0,0,0,.7);

  backdrop-filter:blur(8px);
}

#modal.show{
  display:flex;
}

.commentBox{
  width:100%;

  padding:
    20px
    20px
    calc(20px + env(safe-area-inset-bottom));

  background:#111;

  border-radius:
    25px 25px 0 0;

  border:
    1px solid rgba(255,255,255,.1);
}

.commentTitle{
  font-size:20px;
  font-weight:900;

  margin-bottom:15px;
}

#commentInput{
  width:100%;
  min-height:90px;

  padding:14px;

  resize:none;
  outline:none;

  border-radius:16px;

  background:#050505;
  color:#fff;

  border:
    1px solid rgba(255,255,255,.12);
}

.commentButtons{
  display:flex;
  gap:10px;

  margin-top:10px;
}

.commentButtons button{
  flex:1;

  padding:13px;

  border-radius:14px;

  font-weight:900;

  cursor:pointer;
}

.send{
  background:#fff;
  color:#000;
}

.close{
  background:#252525;
  color:#fff;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

  .topbar{
    min-height:70px;

    padding:
      calc(10px + env(safe-area-inset-top))
      12px
      10px;
  }

  .logo{
    font-size:20px;
  }

  #searchInput{
    height:40px;
    font-size:14px;
  }

  .card{
    padding:
      86px
      66px
      45px;
  }

  .trophy{
    width:78px;
    height:78px;

    font-size:45px;

    border-radius:24px;

    margin-bottom:13px;
  }

  .recordTitle{
    letter-spacing:-1.7px;
  }

  .recordQuestion{
    font-size:20px;
  }

  .recordSub{
    font-size:13px;
    margin-bottom:15px;
  }

  .detailBtn{
    padding:12px 20px;
  }

  .actions{
    right:10px;
    bottom:80px;

    gap:9px;
  }

  .action{
    width:42px;
    height:42px;

    font-size:18px;
  }

  .progress{
    left:12px;
    right:12px;
    bottom:12px;
  }
}

@media(max-height:700px){

  .trophy{
    width:62px;
    height:62px;

    font-size:35px;

    margin-bottom:7px;
  }

  .recordTitle{
    font-size:34px;
    margin-bottom:9px;
  }

  .recordQuestion{
    font-size:18px;
    margin-bottom:7px;
  }

  .recordSub{
    font-size:12px;
    margin-bottom:9px;
  }

  .detailBtn{
    padding:10px 17px;
    font-size:12px;
  }

  .card.showDetails .details{
    max-height:25vh;
  }
}
</style>
</head>

<body>

<!-- =====================================================
     INTRO

<div id="intro">

<div id="app">

</div>

</div>

/* =========================================================
   DETERMINISTIK RASTGELE
========================================================= */

function hash(seed){

  let x =
    Math.imul(
      seed ^ 0x6D2B79F5,
      2654435761
    );

  x ^=
    x >>> 16;

  x =
    Math.imul(
      x,
      2246822507
    );

  x ^=
    x >>> 13;

  x =
    Math.imul(
      x,
      3266489909
    );

  x ^=
    x >>> 16;

  return (
    x >>> 0
  ) /
  4294967296;
}


function pick(array,seed){

  return array[
    Math.floor(
      hash(seed) *
      array.length
    )
  ];

}


/* =========================================================
   20 MİLYONLUK İÇERİK ÜRETİCİ
========================================================= */

function generateContent(index){

  /*
    Temel doğrulanabilir rekorlar.
  */

  if(
    index <
    records.length
  ){

    return {
      ...records[index],
      index
    };

  }


  /*
    20 milyon kapasitenin geri kalan kısmı
    deterministik içerik kombinasyonlarıdır.

    Burada gerçek bir rekoru rastgele uydurmak
    yerine "rekor keşfi" formatı kullanıyoruz.
  */

  const category=
    pick(
      categories,
      index*17+3
    );


  const topic=
    pick(
      generatedTopics,
      index*29+7
    );


  const icon=
    pick(
      generatedIcons,
      index*43+11
    );


  const variants=[
    "ölçek",
    "dayanıklılık",
    "hız",
    "yükseklik",
    "derinlik",
    "uzunluk",
    "büyüklük",
    "yaşam süresi"
  ];


  const variant=
    pick(
      variants,
      index*59+13
    );


  const adjectives=[
    "olağanüstü",
    "dikkat çekici",
    "sıra dışı",
    "devasa",
    "çok yüksek",
    "çok derin",
    "çok uzun",
    "çok hızlı"
  ];


  const adjective=
    pick(
      adjectives,
      index*71+19
    );


  return {

    title:
      `${adjective} ${topic} rekoru`,

    icon,

    type:
      `${category} REKORLARI`,

    question:
      `${topic} alanında ${variant} açısından dikkat çeken rekor türü nedir?`,

    record:
      "Rekor keşfi",

    detail:
      "Bu içerik, RekorTok'un geniş içerik üretim sistemindeki keşif kartlarından biridir. Kesin sayısal değerler için ilgili resmi rekor kaynağı ayrıca doğrulanmalıdır.",

    holder:
      `${topic} alanındaki örnek`,

    category,

    fact:
      `Bu kart, ${category.toLocaleLowerCase("tr-TR")} kategorisinde ${variant} temasını işler.`,

    generated:true,

    index

  };

}

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function renderNormal(){

  document
    .getElementById("empty")
    .classList

  document
    .getElementById("searchInfo")
    .classList
    .remove("show");


  const feed=
    document.getElementById(
      "feed"
    );


  feed.innerHTML="";


  const previousIndex=
    currentIndex<=0
    ? TOTAL_CONTENT-1
    : currentIndex-1;


  const nextIndex=
    currentIndex>=TOTAL_CONTENT-1
    ? 0
    : currentIndex+1;


  const previousRecord=
    generateContent(
      previousIndex
    );


  const currentRecord=
    generateContent(
      currentIndex
    );


  const nextRecord=
    generateContent(
      nextIndex
    );


  const previous=
    createCard(
      previousRecord,
      previousIndex
    );


  const current=
    createCard(
      currentRecord,
      currentIndex
    );


  const next=
    createCard(
      nextRecord,
      nextIndex
    );


  previous.classList.add(
    "previous"
  );


  current.classList.add(
    "active"
  );


  next.classList.add(
    "next"
  );


  feed.appendChild(
    previous
  );

  feed.appendChild(
    current
  );

  feed.appendChild(
    next
  );


  updateProgress();

}

   NEXT
========================================================= */

function nextItem(){

  if(moving)
    return;


  moving=true;


  if(searchMode){

    nextSearch();

  }else{

    currentIndex++;

    if(
      currentIndex>=
      TOTAL_CONTENT
    ){

      currentIndex=0;

    }

    renderNormal();

  }


  setTimeout(()=>{
    moving=false;
  },430);

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousItem(){

  if(moving)
    return;


  moving=true;


  if(searchMode){

    previousSearch();

  }else{

    currentIndex--;

    if(
      currentIndex<0
    ){

      currentIndex=
        TOTAL_CONTENT-1;

    }

    renderNormal();

  }


  setTimeout(()=>{
    moving=false;
  },430);

}


/* =========================================================
   ARAMA
========================================================= */

function normalize(text){

  return String(
    text || ""
  )
  .toLocaleLowerCase(
    "tr-TR"
  )
  .replace(/ı/g,"i")
  .replace(/ğ/g,"g")
  .replace(/ü/g,"u")
  .replace(/ş/g,"s")
  .replace(/ö/g,"o")
  .replace(/ç/g,"c")
  .normalize("NFD")
  .replace(
    /[\u0300-\u036f]/g,
    ""
  )
  .replace(
    /\s+/g,
    " "
  )
  .trim();

}


function searchRecords(query){

  const q=
    normalize(query);


  if(!q)
    return [];


  const exact=[];
  const starts=[];
  const contains=[];
  const other=[];


  records.forEach(
    (record,index)=>{

      const title=
        normalize(
          record.title
        );


      const text=
        normalize([
          record.title,
          record.type,
          record.question,
          record.record,
          record.detail,
          record.holder,
          record.category,
          record.fact
        ].join(" "));


      const result={
        ...record,
        index
      };


      if(
        title===q
      ){

        exact.push(result);

      }else if(
        title.startsWith(q)
      ){

        starts.push(result);

      }else if(
        title.includes(q)
      ){

        contains.push(result);

      }else if(
        text.includes(q)
      ){

        other.push(result);

      }

    }
  );


  return [
    ...exact,
    ...starts,
    ...contains,
    ...other
  ];

}

function renderSearch(){

  const feed=
    document.getElementById(
      "feed"
    );


  feed.innerHTML="";


  if(
    searchResults.length===0
  ){

    document
      .getElementById("empty")
      .classList
      .add("show");


    const info=
      document.getElementById(
        "searchInfo"
      );


    info.textContent=
      "Rekor bulunamadı";


    info.classList.add(
      "show"
    );


    updateProgress();

    return;

  }


  document
    .getElementById("empty")
    .classList
    .remove("show");


  const record=
    searchResults[
      searchIndex
    ];


  const card=
    createCard(
      record,
      record.index
    );


  card.classList.add(
    "active"
  );


  feed.appendChild(
    card
  );


  const info=
    document.getElementById(
      "searchInfo"
    );


  info.textContent=
    `${record.icon} ${record.title}`;


  info.classList.add(
    "show"
  );


  updateProgress();

}


function nextSearch(){

  if(
    searchResults.length<=1
  )
    return;


  searchIndex++;


  if(
    searchIndex>=
    searchResults.length
  ){

    searchIndex=0;

  }


  renderSearch();

}


function previousSearch(){

  if(
    searchResults.length<=1
  )
    return;


  searchIndex--;


  if(
    searchIndex<0
  ){

    searchIndex=
      searchResults.length-1;

  }


  renderSearch();

}


/* =========================================================
   SEARCH INPUT
========================================================= */

const searchInput=
  document.getElementById(
    "searchInput"
  );


const clearSearch=
  document.getElementById(
    "clearSearch"
  );


searchInput.addEventListener(
  "input",
  ()=>{

    const value=
      searchInput.value.trim();


    clearSearch.classList.toggle(
      "show",
      value.length>0
    );


    if(!value){

      searchMode=false;

      searchResults=[];

      searchIndex=0;

      renderNormal();

      return;

    }


    searchResults=
      searchRecords(
        value
      );


    searchIndex=0;

    searchMode=true;

    renderSearch();

  }
);


clearSearch.addEventListener(
  "click",
  ()=>{

    searchInput.value="";

    clearSearch.classList.remove(
      "show"
    );

    searchMode=false;

    searchResults=[];

    searchIndex=0;

    renderNormal();

    searchInput.focus();

  }
);


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress(){

  const fill=
    document.getElementById(
      "progressFill"
    );


  if(
    searchMode
  ){

    if(
      searchResults.length===0
    ){

      fill.style.width="0%";

      return;

    }


    fill.style.width=
      (
        (
          searchIndex+1
        ) /
        searchResults.length *
        100
      )+
      "%";


    return;

  }


  /*
    Görsel ilerleme göstergesi
    20 milyonluk sistemde konuma göre çalışır.
  */

  const percentage=
    (
      (
        currentIndex+1
      ) /
      TOTAL_CONTENT *
      100
    );


  /*
    Çok küçük yüzdelerde bile
    kullanıcıya görünür kalması için
    minimum genişlik kullanıyoruz.
  */

  fill.style.width=
    Math.max(
      0.3,
      percentage
    )+
    "%";

}


/* =========================================================
   TOUCH
========================================================= */

let startY=0;
let startX=0;
let startTime=0;


document.addEventListener(
  "touchstart",
  e=>{

    if(
      e.target.closest("button") ||
      e.target.closest("input") ||
      e.target.closest("textarea")
    ){

      return;

    }


    const touch=
      e.changedTouches[0];


    startY=
      touch.clientY;

    startX=
      touch.clientX;

    startTime=
      Date.now();

  },
  {
    passive:true
  }
);


document.addEventListener(
  "touchend",
  e=>{

    if(
      e.target.closest("button") ||
      e.target.closest("input") ||
      e.target.closest("textarea")
    ){

      return;

    }


    const touch=
      e.changedTouches[0];


    const dy=
      touch.clientY-
      startY;


    const dx=
      touch.clientX-
      startX;


    const duration=
      Date.now()-
      startTime;


    if(
      duration>900
    )
      return;


    if(
      Math.abs(dy)<50
    )
      return;


    if(
      Math.abs(dy)<
      Math.abs(dx)
    )
      return;


    if(
      dy<0
    ){

      nextItem();

    }else{

      previousItem();

    }

  },
  {
    passive:true
  }
);


/* =========================================================
   MOUSE WHEEL
========================================================= */

let wheelLocked=false;


document.addEventListener(
  "wheel",
  e=>{

    if(
      e.target.closest("button") ||
      e.target.closest("input") ||
      e.target.closest("textarea")
    ){

      return;

    }


    if(
      wheelLocked
    )
      return;


    if(
      Math.abs(e.deltaY)<25
    )
      return;


    wheelLocked=true;


    if(
      e.deltaY>0
    ){

      nextItem();

    }else{

      previousItem();

    }


    setTimeout(
      ()=>{
        wheelLocked=false;
      },
      450
    );

  },
  {
    passive:true
  }
);


/* =========================================================
   KLAVYE
========================================================= */

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.target.tagName==="INPUT" ||
      e.target.tagName==="TEXTAREA"
    ){

      return;

    }


    if(
      e.key==="ArrowDown" ||
      e.key==="PageDown" ||
      e.key===" "
    ){

      e.preventDefault();

      nextItem();

    }


    if(
      e.key==="ArrowUp" ||
      e.key==="PageUp"
    ){

      e.preventDefault();

      previousItem();

    }


    if(
      e.key==="Escape"
    ){

      closeComments();

    }

  }
);

        showToast(
          "Yorum gönderildi."
        );

        commentInput.value="";

      }


      closeComments();

    }
  );


modal.addEventListener(
  "click",
  e=>{

    if(
      e.target===
      modal
    ){

      closeComments();

    }

  }
);


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function showToast(text){

  const toast=
    document.getElementById(
      "toast"
    );


  toast.textContent=
    text;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer=
    setTimeout(
      ()=>{
        toast.classList.remove(
          "show"
        );
      },
      1800
    );

}

   BAŞLANGIÇ
========================================================= */

window.addEventListener(
  "load",
  ()=>{

    renderNormal();


    setTimeout(
      ()=>{

        document
          .getElementById("intro")
          .classList
          .add("hide");

      },
      1800
    );

  }
);

</script>
